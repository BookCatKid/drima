# Runs sync on a schedule to catch new builds as they're released and archived.
# Also requests the Wayback Machine to capture the current live game URLs.
name: Sync archive

on:
  schedule:
    # Every 6 hours – captures Poki's deployment cadence and web archive ingest cycles
    - cron: "0 */6 * * *"
  workflow_dispatch: # manual trigger

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and token for pushing back
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install

      - name: Request Wayback captures
        run: node scripts/request-archive.mjs
        continue-on-error: true
        # SPN rate-limits are expected; don't fail the workflow

      - name: Sync archived builds
        run: pnpm sync

      - name: Commit new builds
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/versions/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "sync: update archived builds"
            git push
          fi